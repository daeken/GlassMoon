[package]
name = "glassmoon"
version = "0.1.0"
edition = "2024"

[dependencies]
futures-util = { version = "0.3", features = ["sink"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["codec"] }
