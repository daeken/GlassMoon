<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GlassMoon Workbench</title>
<style>
  body { margin: 1.5rem; font: 18px system-ui; }
  label, input { display: block; margin-bottom: .5rem; }
  input { box-sizing: border-box; width: min(100%, 20rem); font: inherit; }
  button { font: inherit; }
</style>
<h1>GlassMoon Workbench</h1>
<form>
  <label for="note">Note</label>
  <input id="note" name="note" placeholder="Note" required>
  <button type="submit">Save note</button>
</form>
<p id="status" role="status">Waiting for a note</p>
<script>
  document.querySelector('form').addEventListener('submit', event => {
    event.preventDefault();
    document.querySelector('#status').textContent = `Saved: ${document.querySelector('#note').value}`;
  });
</script>
</html>
